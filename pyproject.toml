[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finding-level-itv"
version = "0.1.0"
description = "Finding-level inference-time verification for set-valued extraction"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Stephen Barlow"}]
dependencies = []

[project.optional-dependencies]
text = ["nltk"]
test = ["pytest"]
huggingface = ["accelerate", "bitsandbytes", "peft", "transformers"]
unsloth = ["accelerate", "bitsandbytes", "datasets", "peft", "transformers", "trl", "unsloth"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

